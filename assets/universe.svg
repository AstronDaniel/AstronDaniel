<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background stars -->
  <rect width="800" height="400" fill="#0D1117" />
  
  <!-- Random stars -->
  <circle cx="50" cy="50" r="1" fill="white" />
  <circle cx="120" cy="60" r="1.5" fill="white" />
  <circle cx="200" cy="30" r="1" fill="white" />
  <circle cx="280" cy="70" r="2" fill="white" />
  <circle cx="350" cy="40" r="1" fill="white" />
  <circle cx="420" cy="90" r="1.5" fill="white" />
  <circle cx="500" cy="35" r="1" fill="white" />
  <circle cx="580" cy="65" r="2" fill="white" />
  <circle cx="650" cy="45" r="1" fill="white" />
  <circle cx="720" cy="85" r="1.5" fill="white" />
  <circle cx="100" cy="150" r="1" fill="white" />
  <circle cx="170" cy="160" r="1.5" fill="white" />
  <circle cx="250" cy="130" r="1" fill="white" />
  <circle cx="330" cy="170" r="2" fill="white" />
  <circle cx="400" cy="140" r="1" fill="white" />
  <circle cx="470" cy="190" r="1.5" fill="white" />
  <circle cx="550" cy="135" r="1" fill="white" />
  <circle cx="630" cy="165" r="2" fill="white" />
  <circle cx="700" cy="145" r="1" fill="white" />
  <circle cx="770" cy="185" r="1.5" fill="white" />
  <circle cx="80" cy="250" r="1" fill="white" />
  <circle cx="150" cy="260" r="1.5" fill="white" />
  <circle cx="230" cy="230" r="1" fill="white" />
  <circle cx="310" cy="270" r="2" fill="white" />
  <circle cx="380" cy="240" r="1" fill="white" />
  <circle cx="450" cy="290" r="1.5" fill="white" />
  <circle cx="530" cy="235" r="1" fill="white" />
  <circle cx="610" cy="265" r="2" fill="white" />
  <circle cx="680" cy="245" r="1" fill="white" />
  <circle cx="750" cy="285" r="1.5" fill="white" />
  <circle cx="60" cy="350" r="1" fill="white" />
  <circle cx="130" cy="360" r="1.5" fill="white" />
  <circle cx="210" cy="330" r="1" fill="white" />
  <circle cx="290" cy="370" r="2" fill="white" />
  <circle cx="360" cy="340" r="1" fill="white" />
  <circle cx="430" cy="390" r="1.5" fill="white" />
  <circle cx="510" cy="335" r="1" fill="white" />
  <circle cx="590" cy="365" r="2" fill="white" />
  <circle cx="660" cy="345" r="1" fill="white" />
  <circle cx="730" cy="385" r="1.5" fill="white" />
  
  <!-- Sun -->
  <circle cx="400" cy="200" r="30" fill="url(#sunGradient)">
    <animate attributeName="r" values="30;32;30" dur="4s" repeatCount="indefinite" />
  </circle>
  
  <!-- Planet orbits -->
  <circle cx="400" cy="200" r="60" fill="none" stroke="#222" stroke-width="0.5" />
  <circle cx="400" cy="200" r="90" fill="none" stroke="#222" stroke-width="0.5" />
  <circle cx="400" cy="200" r="120" fill="none" stroke="#222" stroke-width="0.5" />
  <circle cx="400" cy="200" r="160" fill="none" stroke="#222" stroke-width="0.5" />
  <circle cx="400" cy="200" r="200" fill="none" stroke="#222" stroke-width="0.5" />
  <circle cx="400" cy="200" r="240" fill="none" stroke="#222" stroke-width="0.5" />
  
  <!-- Mercury (closest to sun) -->
  <circle cx="460" cy="200" r="4" fill="#B5B8B1">
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      from="0 400 200" 
      to="360 400 200" 
      dur="5s" 
      repeatCount="indefinite" />
  </circle>
  
  <!-- Venus -->
  <circle cx="490" cy="200" r="7" fill="#E39E65">
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      from="0 400 200" 
      to="360 400 200" 
      dur="8s" 
      repeatCount="indefinite" />
  </circle>
  
  <!-- Earth -->
  <circle cx="520" cy="200" r="8" fill="#6B93D6">
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      from="0 400 200" 
      to="360 400 200" 
      dur="12s" 
      repeatCount="indefinite" />
  </circle>
  
  <!-- Mars -->
  <circle cx="560" cy="200" r="6" fill="#C1440E">
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      from="0 400 200" 
      to="360 400 200" 
      dur="15s" 
      repeatCount="indefinite" />
  </circle>
  
  <!-- Jupiter -->
  <circle cx="600" cy="200" r="15" fill="#E0AE6F">
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      from="0 400 200" 
      to="360 400 200" 
      dur="20s" 
      repeatCount="indefinite" />
  </circle>
  
  <!-- Saturn with rings -->
  <g>
    <ellipse cx="640" cy="200" rx="20" ry="3" fill="none" stroke="#B7B8B9" stroke-width="2" />
    <circle cx="640" cy="200" r="12" fill="#EDC891" />
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      from="0 400 200" 
      to="360 400 200" 
      dur="25s" 
      repeatCount="indefinite" />
  </g>
  
  <!-- Comet with trail -->
  <g>
    <path d="M 200,100 Q 350,150 380,170" fill="none" stroke="rgba(116, 185, 255, 0.3)" stroke-width="2">
      <animate attributeName="d" 
               values="M 200,100 Q 350,150 380,170;
                       M 220,110 Q 360,160 390,180;
                       M 240,120 Q 370,170 400,190;
                       M 220,110 Q 360,160 390,180;
                       M 200,100 Q 350,150 380,170" 
               dur="10s" 
               repeatCount="indefinite" />
    </path>
    <circle cx="200" cy="100" r="3" fill="#74b9ff">
      <animate attributeName="cx" 
               values="200;220;240;220;200" 
               dur="10s" 
               repeatCount="indefinite" />
      <animate attributeName="cy" 
               values="100;110;120;110;100" 
               dur="10s" 
               repeatCount="indefinite" />
    </circle>
  </g>
  
  <!-- Satellite -->
  <g>
    <circle cx="520" cy="190" r="2" fill="#ccc">
      <animateTransform 
        attributeName="transform" 
        type="rotate" 
        from="0 520 200" 
        to="360 520 200" 
        dur="2s" 
        repeatCount="indefinite" />
      <animateTransform 
        attributeName="transform" 
        type="rotate" 
        from="0 400 200" 
        to="360 400 200" 
        dur="12s" 
        repeatCount="indefinite" 
        additive="sum" />
    </circle>
  </g>
  
  <!-- Definitions -->
  <defs>
    <radialGradient id="sunGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#fff; stop-opacity:1" />
      <stop offset="20%" style="stop-color:#fff200; stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff7700; stop-opacity:1" />
    </radialGradient>
  </defs>
</svg>