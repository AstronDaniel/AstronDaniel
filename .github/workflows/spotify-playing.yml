name: Spotify Now Playing

on:
  schedule:
    - cron: '0 */2 * * *' # Update every 2 hours
  workflow_dispatch:

jobs:
  update-readme:
    name: Update Spotify Status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Update Spotify Recently Played
        uses: sindresorhus/spotify-recently-played-readme@main
        with:
          client_id: ${{ secrets.SPOTIFY_CLIENT_ID }}
          client_secret: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          refresh_token: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          readme_path: ./README.md
          count: 5 # Number of recently played songs to display
